    "target_id": "miniklarna-unsafe",
    "authorization_scope_id": "miniklarna-unsafe-local",
    "read_only_operations": [
      "get_account_details",
      "lookup_order",
      "retrieve_policy"
    ],
    "mutating_operations": [
      "escalate_to_human",
      "process_refund",
      "schedule_payment"
    ],
    "capture": {
      "query_source": "use_case"
    }
  }
