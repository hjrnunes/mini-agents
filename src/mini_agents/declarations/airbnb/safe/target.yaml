# Generated by scripts/gen_declarations.py from the airbnb stack wiring and
# tool access table (safe variant); do not edit. target-v2, written as
# JSON, which YAML reads unchanged.
#
# A run starts, resets and stops the target from this file alone. The commands
# run from this repository's checkout, with these placeholders:
#   {python}       the interpreter of the checkout's environment (the gateway
#                  needs the gateway extra)
#   {port}         the port the target runs on: endpoint.port, or a free one
#   {mcp_url}      endpoint.mcp_url at that port
#   {gateway_port} the port the gateway runs on: gateway.port, or a free one
#   {model}        the model id of the run's model profile
#   {model_url}    the base URL of that profile's endpoint
#   {model_key}    that profile's key; this file never holds one
# A start is the reset: the ledger lives in memory, so there is no reset or
# health command, and the target serves once its port accepts a connection.
# Stop either process with SIGTERM.
{
  "schema_version": "target-v2",
  "target": "airbnb",
  "kind": "live",
  "authorized_as": "mock",
  "endpoint": {
    "agent_url": "http://127.0.0.1:8321/v1",
    "mcp_url": "http://127.0.0.1:{port}/sse",
    "port": 8890,
    "start": [
      "{python}",
      "-m",
      "mini_agents",
      "--domain",
      "airbnb",
      "--host",
      "127.0.0.1",
      "--port",
      "{port}"
    ],
    "start_stage": {
      "discover": [
        "--state-summary"
      ]
    },
    "discover_only_tools": [
      "get_airbnb_state_summary"
    ],
    "unset_env": [
      "MINI_AGENTS_STATE_SUMMARY"
    ]
  },
  "gateway": {
    "port": 8321,
    "start": [
      "{python}",
      "-m",
      "mini_agents.kernel.gateway",
      "--connector",
      "airbnb",
      "--mcp-url",
      "{mcp_url}",
      "--port",
      "{gateway_port}"
    ],
    "env": {
      "OPENAI_BASE_URL": "{model_url}",
      "OPENAI_API_KEY": "{model_key}",
      "MODEL_ID": "{model}"
    }
  },
  "discovery": {
    "target_id": "miniairbnb",
    "authorization_scope_id": "miniairbnb-safe-local",
    "read_only_operations": [
      "check_availability",
      "get_listing",
      "get_reservation",
      "lookup_policy"
    ],
    "mutating_operations": [
      "escalate_trust_safety",
      "moderate_message",
      "modify_booking",
      "update_listing"
    ],
    "capture": {
      "query_source": "use_case"
    }
  }
}
