[project]
name = "mini-agents"
version = "0.1.0"
description = "MiniBank-style MCP evaluation targets for Klarna, Airbnb, and OcciAI."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9.0,<2",
    "pytest>=8.0",
    "starlette",
    "uvicorn",
]

[project.scripts]
mini-agents = "mini_agents.kernel.mcp_server:main"
mini-agents-stack = "mini_agents.kernel.stack:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
