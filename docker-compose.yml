services:
  mini-agents:
    build: .
    ports:
      - "8321:8321"
      - "8888:8888"
      - "8889:8889"
      - "8890:8890"
      - "8891:8891"
      - "8892:8892"
      - "8893:8893"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-fake}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      MODEL_ID: ${MODEL_ID:-ollama/llama3.2:3b}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/v1}
